version: '3.8'

services:
  meu-banco:
    image: ${DB_IMAGE}
    container_name: ${DB_CONTAINER_NAME}
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    networks:
      - rede-segura
    volumes:
      - dados_postgres:/var/lib/postgresql/data

volumes:
  dados_postgres:

networks:
  rede-segura:
    driver: bridge
